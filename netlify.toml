[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/lead"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

# На первом этапе для всех стран используется одна общая страница.
# Редиректы временные: отдельные версии можно вернуть после запуска.
[[redirects]]
  from = "/uz"
  to = "/"
  status = 302
[[redirects]]
  from = "/uz/*"
  to = "/"
  status = 302

