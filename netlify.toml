[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/lead"
  status = 200

# На первом этапе для всех стран используется одна общая страница.
# Временные редиректы сохраняют возможность вернуть региональные версии позднее.
[[redirects]]
  from = "/uz/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/kz/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/kg/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/by/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/az/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/am/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/tm/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/tj/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/cis/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/ru/*"
  to = "/"
  status = 302

[[redirects]]
  from = "http://magicmet.ru/*"
  to = "https://www.magicmet.ru/:splat"
  status = 301
  force = true