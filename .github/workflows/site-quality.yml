name: site-quality

on:
  pull_request:
    branches: [main, design-exact-approved]
  push:
    branches: [design-exact-approved]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax check
        run: npm run check:js

      - name: HTML validation
        run: npm run validate:html

      - name: Contact policy check
        run: npm run check:contacts

      - name: Functional and visual capture tests
        run: npx playwright test --project=chromium --project=mobile-chrome

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-mail=false
            --root-dir .
            --exclude 'https://images.unsplash.com/.*'
            --exclude '^https://www\.magicmet\.ru/catalog/?$'
            './*.html'
            './catalog/**/*.html'
          fail: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
