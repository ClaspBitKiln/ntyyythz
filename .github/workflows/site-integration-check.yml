name: site-integration-check

on:
  push:
    branches:
      - agent/site-integration-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-integration-check
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax
        run: npm run check:js

      - name: HTML validation
        run: npm run validate:html

      - name: Contact policy
        run: npm run check:contacts

      - name: LeadGateway contract
        run: npm run test:gateway

      - name: Functional and visual tests
        run: npx playwright test --project=chromium --project=mobile-chrome

      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
