name: LeadGateway contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lead-gateway.yml'
      - 'app.js'
      - 'netlify/functions/lead.js'
      - 'netlify/functions/lead.mjs'
      - 'netlify.toml'
      - 'package.json'
      - 'tests/lead-gateway.test.js'
      - 'tests/site.spec.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test server-side gateway contract
        run: npm run test:gateway

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser fallback contract
        run: npx playwright test tests/site.spec.js --grep "при ошибке LeadGateway"
